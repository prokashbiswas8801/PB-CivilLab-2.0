<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="192" height="192">
  <defs>
    <linearGradient id="pb-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pb-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Foundation Base -->
  <rect width="64" height="64" rx="14" fill="#0F172A" />

  <!-- Subtle Engineering Grid Lines -->
  <path d="M12 20h40M12 32h40M12 44h40M20 12v40M32 12v40M44 12v40" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="1 3" />

  <!-- Structural Accent Beam Corner -->
  <path d="M12 16L16 12M48 52l4-4" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Civil / Structural Monogram "PB" -->
  <g transform="translate(11, 14)">
    <!-- Column Mast (Structural I-Pillar) -->
    <rect x="0" y="2" width="6" height="32" rx="1.5" fill="url(#pb-blue-grad)" />
    
    <!-- Letter 'P' Loop -->
    <path d="M6 4h10c5 0 8.5 2.5 8.5 7.5S21 19 16 19H6V4z" fill="none" stroke="url(#pb-blue-grad)" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Letter 'B' Backbone & Structural Double Loop -->
    <rect x="18" y="2" width="5.5" height="32" rx="1.2" fill="#E2E8F0" />
    <path d="M23 4h8c4.2 0 7 2.2 7 6.2 0 3.2-1.8 5.2-4.8 5.8 3.8.7 5.8 3 5.8 6.8 0 4.5-3.2 7.2-8 7.2h-8" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Engineering Axis Point Indicator -->
    <circle cx="21" cy="18" r="2" fill="#38BDF8" />
    <path d="M19 18h4M21 16v4" stroke="#0F172A" stroke-width="0.8" stroke-linecap="round" />
  </g>
</svg>
