      // Compatibility defense for browser extensions (e.g. proxy/interceptor extensions)
      // that attempt direct assignment to window.fetch:
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {
          // Ignore if descriptor modification is locked
        }
